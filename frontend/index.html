<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PyPI DAST</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono&display=swap');
    :root{--ink:#17211f;--paper:#f4f1e8;--lime:#c8f169;--coral:#f1765d;--line:#ccd0c2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px 'Space Grotesk',sans-serif}main{max-width:1180px;margin:auto;padding:38px 24px}.top{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:22px}.eyebrow{font:12px 'IBM Plex Mono',monospace;letter-spacing:1px}.brand{font-size:clamp(2.5rem,7vw,6rem);line-height:.9;font-weight:700;letter-spacing:-3px}.badge{background:var(--lime);padding:10px 14px;border:1px solid var(--ink);font:12px 'IBM Plex Mono',monospace}.toolbar{display:flex;gap:10px;margin:28px 0;flex-wrap:wrap}input,button{border:1px solid var(--ink);padding:13px 15px;font:inherit}input{background:#fff;flex:1;min-width:220px}button{background:var(--ink);color:#fff;cursor:pointer}button:hover{background:var(--coral)}table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:16px;border-bottom:1px solid var(--line)}th{font:11px 'IBM Plex Mono',monospace;text-transform:uppercase;background:#e6e5da}.score{font-weight:700}.empty{padding:50px;text-align:center;border:1px dashed var(--ink)}@media(max-width:650px){.top{display:block}.badge{display:inline-block;margin-top:22px}th:nth-child(4),td:nth-child(4){display:none}}
  </style>
</head>
<body><main><header class="top"><div><div class="eyebrow">DYNAMIC ANALYSIS / PYPI ONLY</div><div class="brand">DAST<span style="color:var(--coral)">.</span></div></div><div class="badge">RUNTIME: GVISOR</div></header><section class="toolbar"><input id="package" placeholder="requests==2.31.0"><button onclick="analyze()">+ ANALYZE</button><button onclick="loadReports()">REFRESH</button></section><section id="content" class="empty">No analyses loaded.</section></main>
<script>const api='http://localhost:8000';async function loadReports(){const r=await fetch(api+'/api/analysis');const rows=await r.json();document.querySelector('#content').innerHTML=rows.length?`<table><thead><tr><th>Package</th><th>Distribution</th><th>Risk</th><th>Severity</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.package.name}${x.package.version?'=='+x.package.version:''}</td><td>${x.package.distribution?.type||'pending'}</td><td class="score">${x.summary?.risk_score??'--'}</td><td>${x.summary?.severity||'QUEUED'}</td><td>${x.analysis?.status||'queued'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No analyses loaded.</div>'}async function analyze(){const value=document.querySelector('#package').value.trim();if(!value)return;const [pkg,version]=value.split('==');await fetch(api+'/api/analysis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({package:pkg,version:version||null})});loadReports()}loadReports()</script></body></html>
