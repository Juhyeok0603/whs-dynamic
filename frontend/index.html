<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PyPI DAST</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono&display=swap');
    :root{--ink:#17211f;--paper:#f4f1e8;--lime:#c8f169;--coral:#f1765d;--line:#ccd0c2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px 'Space Grotesk',sans-serif}main{max-width:1180px;margin:auto;padding:38px 24px}.top{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:22px}.eyebrow{font:12px 'IBM Plex Mono',monospace;letter-spacing:1px}.brand{font-size:clamp(2.5rem,7vw,6rem);line-height:.9;font-weight:700;letter-spacing:-3px}.badge{background:var(--lime);padding:10px 14px;border:1px solid var(--ink);font:12px 'IBM Plex Mono',monospace}.toolbar{display:flex;gap:10px;margin:28px 0;flex-wrap:wrap}input,button{border:1px solid var(--ink);padding:13px 15px;font:inherit}input{background:#fff;flex:1;min-width:220px}button{background:var(--ink);color:#fff;cursor:pointer}button:hover{background:var(--coral)}table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:16px;border-bottom:1px solid var(--line)}th{font:11px 'IBM Plex Mono',monospace;text-transform:uppercase;background:#e6e5da}tr[data-id]{cursor:pointer}tr[data-id]:hover td{background:#eeeee2}.score{font-weight:700}.empty{padding:50px;text-align:center;border:1px dashed var(--ink)}
    .detail{position:fixed;inset:0;background:rgba(23,33,31,.55);display:flex;justify-content:flex-end;z-index:10}.panel{background:var(--paper);width:min(720px,100%);height:100%;overflow-y:auto;padding:30px;border-left:2px solid var(--ink)}.panel h2{margin:0 0 4px;font-size:1.6rem}.panel .sub{font:12px 'IBM Plex Mono',monospace;color:#555;margin-bottom:20px}.close{position:absolute;top:26px;right:26px}.sec{margin:22px 0;padding-top:18px;border-top:1px solid var(--line)}.sec h3{font:12px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:1px;margin:0 0 10px}.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px}.kv div:nth-child(odd){font:12px 'IBM Plex Mono',monospace;color:#555}.chip{display:inline-block;padding:2px 8px;margin:2px 4px 2px 0;font:11px 'IBM Plex Mono',monospace;border:1px solid var(--ink)}.chip.ok{background:var(--lime)}.chip.bad{background:var(--coral);color:#fff}.finding{background:#fff;border:1px solid var(--line);padding:10px 12px;margin-bottom:8px}.finding .sev{font:11px 'IBM Plex Mono',monospace;font-weight:700}.stagebar{display:flex;gap:6px;flex-wrap:wrap}.stage{padding:4px 10px;font:11px 'IBM Plex Mono',monospace;border:1px solid var(--ink)}.stage.completed{background:var(--lime)}.stage.failed,.stage.timeout{background:var(--coral);color:#fff}pre{white-space:pre-wrap;word-break:break-all;background:#fff;border:1px solid var(--line);padding:10px;font:12px 'IBM Plex Mono',monospace;max-height:180px;overflow-y:auto}
    @media(max-width:650px){.top{display:block}.badge{display:inline-block;margin-top:22px}th:nth-child(4),td:nth-child(4){display:none}.panel{width:100%}}
  </style>
</head>
<body><main><header class="top"><div><div class="eyebrow">DYNAMIC ANALYSIS / PYPI ONLY</div><div class="brand">DAST<span style="color:var(--coral)">.</span></div></div><div class="badge">RUNTIME: GVISOR</div></header><section class="toolbar"><input id="package" placeholder="requests==2.31.0"><button onclick="analyze()">+ ANALYZE</button><button onclick="loadReports()">REFRESH</button></section><section id="content" class="empty">No analyses loaded.</section></main>
<div id="overlay"></div>
<script>
const api='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function loadReports(){
  const r=await fetch(api+'/api/analysis');const rows=await r.json();
  document.querySelector('#content').innerHTML=rows.length?`<table><thead><tr><th>Package</th><th>Distribution</th><th>Risk</th><th>Severity</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr data-id="${x.analysis_id}"><td>${esc(x.package.name)}${x.package.version?'=='+esc(x.package.version):''}</td><td>${esc(x.package.distribution?.type||'pending')}</td><td class="score">${x.summary?.risk_score??'--'}</td><td>${esc(x.summary?.severity||'QUEUED')}</td><td>${esc(x.analysis?.status||'queued')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No analyses loaded.</div>';
  document.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>openDetail(tr.dataset.id));
}

async function analyze(){
  const value=document.querySelector('#package').value.trim();if(!value)return;
  const [pkg,version]=value.split('==');
  await fetch(api+'/api/analysis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({package:pkg,version:version||null})});
  loadReports();
}

async function openDetail(id){
  const r=await fetch(api+'/api/analysis/'+id);const rep=await r.json();
  if(!rep.summary){document.querySelector('#overlay').innerHTML=`<div class="detail" onclick="closeDetail(event)"><div class="panel"><button class="close" onclick="closeDetail(event)">CLOSE</button><h2>${esc(id)}</h2><div class="sub">status: ${esc(rep.status||'unknown')} — no report yet</div></div></div>`;return;}
  const cs=rep.collector_status||{};
  const collectorChip=(name,status)=>`<span class="chip ${/success|active|ready|via /.test(status)?'ok':'bad'}" title="${esc(status)}">${esc(name)}: ${esc(status)}</span>`;
  const findings=(rep.findings||[]).map(f=>`<div class="finding"><span class="sev">[${esc(f.severity)}]</span> ${esc(f.title)} <span style="color:#555">(${esc(f.rule_id)}, stage: ${esc(f.stage)}, confidence: ${f.confidence})</span></div>`).join('')||'<div class="empty">No findings.</div>';
  const stages=(rep.stages||[]).map(s=>`<span class="stage ${esc(s.status)}" title="exit ${s.exit_code}, ${s.duration_seconds}s">${esc(s.name)}: ${esc(s.status)}</span>`).join('');
  const ru=rep.resource_usage||{};
  const chains=(rep.behavior_chains||[]).map(c=>`<div class="finding">${esc(c.title)} <span style="color:#555">(confidence: ${c.confidence})</span></div>`).join('')||'<div class="empty">No chains.</div>';
  document.querySelector('#overlay').innerHTML=`<div class="detail" onclick="closeDetail(event)"><div class="panel" onclick="event.stopPropagation()">
    <button class="close" onclick="closeDetail(event)">CLOSE</button>
    <h2>${esc(rep.package.name)}${rep.package.version?'=='+esc(rep.package.version):''}</h2>
    <div class="sub">${esc(id)} — risk ${rep.summary.risk_score} / ${esc(rep.summary.severity)} — sandbox: ${esc(rep.sandbox?.runtime)} (network: ${esc(rep.sandbox?.network_mode)})</div>

    <div class="sec"><h3>Stages</h3><div class="stagebar">${stages}</div></div>

    <div class="sec"><h3>Findings (${rep.findings.length})</h3>${findings}</div>

    <div class="sec"><h3>Behavior chains</h3>${chains}</div>

    <div class="sec"><h3>Collector status</h3>${Object.entries(cs).map(([k,v])=>collectorChip(k,v)).join('')}</div>

    <div class="sec"><h3>Resource usage</h3><div class="kv">
      <div>proc</div><div>${ru.proc?`${ru.proc.samples} samples, max ${ru.proc.processes} procs, ${ru.proc.rss_kb} KB RSS`:'—'}</div>
      <div>cgroup</div><div>${ru.cgroup?`${ru.cgroup.samples} samples, ${(ru.cgroup.memory_bytes/1048576).toFixed(1)} MB, ${ru.cgroup.pids} pids, ${(ru.cgroup.cpu_usec/1e6).toFixed(2)}s cpu`:'—'}</div>
    </div></div>

    <div class="sec"><h3>Behavior counts</h3><div class="kv">
      <div>processes</div><div>${rep.summary.process_events}</div>
      <div>files</div><div>${rep.summary.file_events}</div>
      <div>network</div><div>${rep.summary.network_events}</div>
      <div>dns queries</div><div>${rep.summary.dns_queries}</div>
    </div></div>

    <div class="sec"><h3>Filesystem diff</h3><div class="kv">
      <div>created</div><div>${rep.filesystem_diff?.created?.length||0}</div>
      <div>modified</div><div>${rep.filesystem_diff?.modified?.length||0}</div>
      <div>deleted</div><div>${rep.filesystem_diff?.deleted?.length||0}</div>
    </div></div>

    ${rep.errors?.length?`<div class="sec"><h3>Errors</h3><pre>${esc(rep.errors.join('\n'))}</pre></div>`:''}
  </div></div>`;
}

function closeDetail(e){if(e.target===e.currentTarget||e.target.classList.contains('close'))document.querySelector('#overlay').innerHTML='';}

loadReports();
</script></body></html>
