<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PyPI DAST</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono&display=swap');
    :root{--ink:#17211f;--paper:#f4f1e8;--lime:#c8f169;--coral:#f1765d;--line:#ccd0c2}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font:16px 'Space Grotesk',sans-serif}
    main{max-width:1180px;margin:auto;padding:38px 24px}
    .top{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:22px}
    .eyebrow{font:12px 'IBM Plex Mono',monospace;letter-spacing:1px}
    .brand{font-size:clamp(2.5rem,7vw,6rem);line-height:.9;font-weight:700;letter-spacing:-3px}
    .badge{background:var(--lime);padding:10px 14px;border:1px solid var(--ink);font:12px 'IBM Plex Mono',monospace}
    .sechead{font:12px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:1px;color:#555;margin:30px 0 6px}
    .toolbar{display:flex;gap:10px;margin:0 0 10px;flex-wrap:wrap}
    input,button,select{border:1px solid var(--ink);padding:13px 15px;font:inherit}
    input{background:#fff;flex:1;min-width:200px}
    select{background:#fff}
    button{background:var(--ink);color:#fff;cursor:pointer;white-space:nowrap}
    button:hover{background:var(--coral)}
    button.secondary{background:#fff;color:var(--ink)}
    .searchcard{background:#fff;border:1px solid var(--line);padding:18px;margin:10px 0 28px}
    .searchcard .pkgname{font-weight:700;font-size:1.15rem}
    .searchcard .summary{color:#555;font-size:14px;margin:4px 0 14px}
    table{width:100%;border-collapse:collapse;background:#fff}
    th,td{text-align:left;padding:16px;border-bottom:1px solid var(--line);vertical-align:middle}
    th{font:11px 'IBM Plex Mono',monospace;text-transform:uppercase;background:#e6e5da}
    tr[data-id]{cursor:pointer}
    tr[data-id]:hover td{background:#eeeee2}
    .score{font-weight:700}
    .empty{padding:50px;text-align:center;border:1px dashed var(--ink)}
    .empty.small{padding:14px;font-size:13px}
    .count{font:12px 'IBM Plex Mono',monospace;color:#555;margin-bottom:10px}
    .timecell{font:12px 'IBM Plex Mono',monospace;white-space:nowrap}
    .progress{background:#e6e5da;height:8px;width:100%;min-width:90px}
    .progress>div{height:100%;transition:width .3s}
    .progress.completed>div{background:var(--lime)}
    .progress.failed>div,.progress.timeout>div{background:var(--coral)}
    .progress.running>div{background:var(--ink)}
    .progress.queued>div{background:#aaa}
    .stagelabel{font:11px 'IBM Plex Mono',monospace;color:#555;margin-top:4px;white-space:nowrap}
    .detail{position:fixed;inset:0;background:rgba(23,33,31,.55);display:flex;justify-content:flex-end;z-index:10}
    .panel{background:var(--paper);width:min(820px,100%);height:100%;overflow-y:auto;padding:30px;border-left:2px solid var(--ink)}
    .panel h2{margin:0 0 4px;font-size:1.6rem}
    .panel .sub{font:12px 'IBM Plex Mono',monospace;color:#555;margin-bottom:6px}
    .close{position:absolute;top:26px;right:26px}
    .sec{margin:22px 0;padding-top:18px;border-top:1px solid var(--line)}
    .sec h3{font:12px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:1px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
    .sec h3 .n{color:#888;font-weight:400}
    .kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px}
    .kv div:nth-child(odd){font:12px 'IBM Plex Mono',monospace;color:#555}
    .chip{display:inline-block;padding:2px 8px;margin:2px 4px 2px 0;font:11px 'IBM Plex Mono',monospace;border:1px solid var(--ink)}
    .chip.ok{background:var(--lime)}
    .chip.bad{background:var(--coral);color:#fff}
    .chip.neutral{background:#e6e5da}
    .finding{background:#fff;border:1px solid var(--line);padding:10px 12px;margin-bottom:8px;font-size:13px}
    .finding .sev{font:11px 'IBM Plex Mono',monospace;font-weight:700}
    .stagebar{display:flex;flex-direction:column;gap:6px}
    details.stagecard{background:#fff;border:1px solid var(--line)}
    details.stagecard summary{padding:8px 12px;cursor:pointer;font:12px 'IBM Plex Mono',monospace;list-style:none;display:flex;justify-content:space-between;gap:8px}
    details.stagecard summary::-webkit-details-marker{display:none}
    details.stagecard summary::before{content:'▸ ';color:#888}
    details.stagecard[open] summary::before{content:'▾ '}
    details.stagecard[open] summary{border-bottom:1px solid var(--line)}
    details.stagecard .badge2{font-weight:700}
    .stagecard.completed .badge2{color:#3a7d1f}
    .stagecard.failed .badge2,.stagecard.timeout .badge2{color:var(--coral)}
    .stdlabel{font:10px 'IBM Plex Mono',monospace;color:#888;text-transform:uppercase;margin:8px 12px -4px}
    pre{white-space:pre-wrap;word-break:break-all;background:#fff;border:1px solid var(--line);padding:10px;font:12px 'IBM Plex Mono',monospace;max-height:180px;overflow-y:auto;margin:8px 12px}
    details.stagecard pre{max-height:140px}
    .eventrow{font:12px 'IBM Plex Mono',monospace;background:#fff;border:1px solid var(--line);padding:6px 10px;margin-bottom:4px;display:flex;gap:10px}
    .eventrow .tag{color:#888;min-width:70px}
    .eventrow .body{word-break:break-all;color:var(--ink)}
    @media(max-width:650px){.top{display:block}.badge{display:inline-block;margin-top:22px}th:nth-child(2),td:nth-child(2){display:none}th:nth-child(4),td:nth-child(4){display:none}th:nth-child(6),td:nth-child(6){display:none}.panel{width:100%}}
  </style>
</head>
<body><main>
<header class="top"><div><div class="eyebrow">동적 분석 / PyPI 패키지 전용</div><div class="brand">DAST<span style="color:var(--coral)">.</span></div></div><div class="badge">런타임: GVISOR</div></header>

<div class="sechead">새 분석 시작</div>
<section class="toolbar"><input id="searchTerm" placeholder="검색할 패키지 이름 (예: requests)" onkeydown="if(event.key==='Enter')searchPackage()"><button onclick="searchPackage()">검색하기</button></section>
<section id="searchResult"></section>

<div class="sechead">분석 결과 목록</div>
<section class="toolbar"><input id="search" placeholder="결과 목록에서 패키지 이름으로 검색" oninput="applyFilter()"><button class="secondary" onclick="loadReports()">새로고침</button></section>
<div id="count" class="count"></div>
<section id="content" class="empty">분석 결과가 없습니다.</section>
</main>
<div id="overlay"></div>
<script>
const api='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS_KO={queued:'대기중',running:'실행중',completed:'완료',failed:'실패',timeout:'시간초과'};
const t=s=>STATUS_KO[s]||s||'대기중';
const fmtTime=iso=>{if(!iso)return '-';const d=new Date(iso);return isNaN(d)?'-':d.toLocaleString('ko-KR',{hour12:false});};
let allRows=[];
let pollTimer=null;

async function loadReports(){
  const r=await fetch(api+'/api/analysis');
  allRows=await r.json();
  applyFilter();
  schedulePoll();
}

function schedulePoll(){
  const pending=allRows.some(x=>['running','queued'].includes(x.summary?x.analysis.status:x.status));
  if(pending&&!pollTimer)pollTimer=setInterval(loadReports,2000);
  else if(!pending&&pollTimer){clearInterval(pollTimer);pollTimer=null;}
}

function applyFilter(){
  const q=document.querySelector('#search').value.trim().toLowerCase();
  const nameOf=x=>(x.summary?x.package.name:x.package).toLowerCase();
  const rows=q?allRows.filter(x=>nameOf(x).includes(q)):allRows;
  renderTable(rows);
}

function progressBar(x){
  if(x.summary){
    const status=x.analysis.status;
    const cls=['completed','failed','timeout'].includes(status)?status:'queued';
    return `<div class="progress ${cls}"><div style="width:100%"></div></div><div class="stagelabel">${esc(t(status))} · 총 ${x.stages.length}단계</div>`;
  }
  const total=x.total_stages||1,completed=x.completed_stages||0;
  const pct=Math.min(100,Math.round(completed/total*100));
  const cls=x.status==='running'?'running':'queued';
  const label=x.stage?`${esc(t(x.status))} · ${esc(x.stage)}`:esc(t(x.status));
  return `<div class="progress ${cls}"><div style="width:${pct}%"></div></div><div class="stagelabel">${label} (${completed}/${total})</div>`;
}

function rowHtml(x){
  const finished=!!x.summary;
  const name=finished?x.package.name:x.package;
  const version=finished?x.package.version:x.version;
  const dist=finished?(x.package.distribution?.type||'-'):'-';
  const risk=finished?`${x.summary.risk_score} / ${esc(x.summary.severity)}`:'-';
  const status=finished?x.analysis.status:x.status;
  const started=finished?x.analysis.started_at:x.started_at;
  const endedAt=finished?x.analysis.finished_at:x.finished_at;
  return `<tr data-id="${x.analysis_id}">
    <td>${esc(name)}${version?'=='+esc(version):''}</td>
    <td>${esc(dist)}</td>
    <td>${progressBar(x)}</td>
    <td>${risk}</td>
    <td>${esc(t(status))}</td>
    <td class="timecell">${fmtTime(started)}</td>
    <td class="timecell">${fmtTime(endedAt)}</td>
  </tr>`;
}

function renderTable(rows){
  document.querySelector('#count').textContent=allRows.length?`총 ${allRows.length}건 중 ${rows.length}건 표시`:'';
  document.querySelector('#content').innerHTML=rows.length?`<table><thead><tr><th>패키지</th><th>배포유형</th><th>진행률</th><th>위험도</th><th>상태</th><th>시작 시간</th><th>종료 시간</th></tr></thead><tbody>${rows.map(rowHtml).join('')}</tbody></table>`:'<div class="empty">분석 결과가 없습니다.</div>';
  document.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>openDetail(tr.dataset.id));
}

async function searchPackage(){
  const name=document.querySelector('#searchTerm').value.trim();
  if(!name)return;
  const box=document.querySelector('#searchResult');
  box.innerHTML='<div class="empty">PyPI에서 검색 중...</div>';
  let data;
  try{
    const r=await fetch(api+'/api/pypi/'+encodeURIComponent(name));
    if(!r.ok){box.innerHTML=`<div class="empty">"${esc(name)}" 패키지를 PyPI에서 찾지 못했습니다.</div>`;return;}
    data=await r.json();
  }catch(e){box.innerHTML='<div class="empty">검색 중 오류가 발생했습니다. 네트워크 연결을 확인하세요.</div>';return;}
  box.innerHTML=`<div class="searchcard">
    <div class="pkgname">${esc(data.name)}</div>
    <div class="summary">${esc(data.summary||'설명 없음')} — 총 ${data.versions.length}개 버전</div>
    <div class="toolbar">
      <select id="versionSelect">${data.versions.map(v=>`<option value="${esc(v)}">${esc(v)}${v===data.latest_version?' (최신)':''}</option>`).join('')}</select>
      <select id="networkSelect" title="네트워크 모드">
        <option value="restricted" selected>restricted (네트워크 차단, 기본)</option>
        <option value="disabled">disabled (네트워크 차단)</option>
        <option value="full">full (실제 인터넷, 관찰만)</option>
        <option value="sinkhole">sinkhole (TLS 가로채기, 실제 목적지엔 도달 안 함)</option>
      </select>
      <button onclick="analyzeSelected('${esc(data.name)}')">이 버전으로 분석 시작</button>
      <button class="secondary" onclick="document.querySelector('#searchResult').innerHTML=''">취소</button>
    </div>
  </div>`;
}

async function analyzeSelected(pkg){
  const version=document.querySelector('#versionSelect').value;
  const network=document.querySelector('#networkSelect').value;
  await fetch(api+'/api/analysis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({package:pkg,version,network})});
  document.querySelector('#searchResult').innerHTML=`<div class="empty">${esc(pkg)}==${esc(version)} 분석을 큐에 등록했습니다. 아래 목록에서 진행 상황을 확인하세요.</div>`;
  document.querySelector('#searchTerm').value='';
  loadReports();
}

function stageCard(s){
  return `<details class="stagecard ${esc(s.status)}">
    <summary><span>${esc(s.name)}</span><span class="badge2">${esc(t(s.status))} · ${s.duration_seconds}s · exit ${s.exit_code??'-'}</span></summary>
    ${s.stdout?`<div class="stdlabel">stdout</div><pre>${esc(s.stdout)}</pre>`:''}
    ${s.stderr?`<div class="stdlabel">stderr</div><pre>${esc(s.stderr)}</pre>`:''}
    ${!s.stdout&&!s.stderr?'<div class="empty small">출력 없음</div>':''}
  </details>`;
}

function eventRows(events, emptyMsg, limit=30){
  if(!events||!events.length) return `<div class="empty small">${emptyMsg}</div>`;
  const shown=events.slice(0,limit);
  const rows=shown.map(e=>`<div class="eventrow"><span class="tag">${esc(e.stage||'-')}${e.pid!=null?' · pid '+e.pid:''}</span><span class="body">${esc(JSON.stringify(e.data))}</span></div>`).join('');
  const rest=events.length-shown.length;
  return rows+(rest>0?`<div class="stagelabel">+ ${rest}개 더 (총 ${events.length}개)</div>`:'');
}

function syscallChips(totals){
  const entries=Object.entries(totals||{}).sort((a,b)=>b[1]-a[1]);
  if(!entries.length) return '<div class="empty small">수집된 syscall 정보가 없습니다 (strace collector 비활성 — collector 상태를 확인하세요).</div>';
  const shown=entries.slice(0,25);
  const rest=entries.length-shown.length;
  return shown.map(([name,count])=>`<span class="chip neutral">${esc(name)} × ${count}</span>`).join('')+(rest>0?`<div class="stagelabel">+ ${rest}종류 더</div>`:'');
}

function flowRows(flows){
  if(!flows||!flows.length) return '<div class="empty small">캡처된 flow가 없습니다 (network=full일 때만 pcap이 동작).</div>';
  return flows.map(f=>`<div class="eventrow"><span class="tag">${f.packets}pkt</span><span class="body">${esc(f.src)} → ${esc(f.dst)}:${f.dst_port}</span></div>`).join('');
}

function hostBoundaryRows(obs){
  if(!obs||!obs.length) return '<div class="empty small">eBPF 관찰 없음.</div>';
  return obs.slice(0,30).map(o=>`<div class="eventrow"><span class="tag">${esc(o.type)}</span><span class="body">pid ${o.pid} · ${esc(o.comm)}${o.file?' · '+esc(o.file):''}</span></div>`).join('')+(obs.length>30?`<div class="stagelabel">+ ${obs.length-30}개 더 — 호스트 전체 관찰이라 채점에는 미반영, 참고용</div>`:'<div class="stagelabel">호스트 전체 관찰이라 채점에는 미반영, 참고용</div>');
}

function fsPathList(entries, limit=40){
  if(!entries||!entries.length) return '<div class="empty small">없음</div>';
  const shown=entries.slice(0,limit);
  const rest=entries.length-shown.length;
  return `<pre>${esc(shown.map(e=>e.path).join('\n'))}</pre>`+(rest>0?`<div class="stagelabel">+ ${rest}개 더 (총 ${entries.length}개)</div>`:'');
}

async function openDetail(id){
  const r=await fetch(api+'/api/analysis/'+id);const rep=await r.json();
  if(!rep.summary){
    const total=rep.total_stages||1,completed=rep.completed_stages||0;
    const pct=Math.min(100,Math.round(completed/total*100));
    const cls=rep.status==='running'?'running':'queued';
    document.querySelector('#overlay').innerHTML=`<div class="detail" onclick="closeDetail(event)"><div class="panel" onclick="event.stopPropagation()">
      <button class="close" onclick="closeDetail(event)">닫기</button>
      <h2>${esc(rep.package||id)}${rep.version?'=='+esc(rep.version):''}</h2>
      <div class="sub">상태: ${esc(t(rep.status))}${rep.stage?' · 현재 단계: '+esc(rep.stage):''}</div>
      <div class="sub">시작: ${fmtTime(rep.started_at)} · 종료: ${fmtTime(rep.finished_at)}</div>
      <div class="sec"><h3>진행률</h3><div class="progress ${cls}" style="height:14px"><div style="width:${pct}%"></div></div><div class="stagelabel">${completed}/${total} 단계 완료</div></div>
    </div></div>`;
    return;
  }
  const cs=rep.collector_status||{};
  const bh=rep.behavior||{};
  const collectorChip=(name,status)=>`<span class="chip ${/success|active|ready|via /.test(status)?'ok':'bad'}" title="${esc(status)}">${esc(name)}: ${esc(status)}</span>`;
  const findings=(rep.findings||[]).map(f=>`<div class="finding"><span class="sev">[${esc(f.severity)}]</span> ${esc(f.title)} <span style="color:#555">(${esc(f.rule_id)}, 단계: ${esc(f.stage)}, 신뢰도: ${f.confidence})</span></div>`).join('')||'<div class="empty small">탐지된 항목이 없습니다.</div>';
  const stages=(rep.stages||[]).map(stageCard).join('');
  const ru=rep.resource_usage||{};
  const chains=(rep.behavior_chains||[]).map(c=>`<div class="finding">${esc(c.title)} <span style="color:#555">(신뢰도: ${c.confidence})</span></div>`).join('')||'<div class="empty small">연결된 행위 체인이 없습니다.</div>';
  document.querySelector('#overlay').innerHTML=`<div class="detail" onclick="closeDetail(event)"><div class="panel" onclick="event.stopPropagation()">
    <button class="close" onclick="closeDetail(event)">닫기</button>
    <h2>${esc(rep.package.name)}${rep.package.version?'=='+esc(rep.package.version):''}</h2>
    <div class="sub">${esc(id)} — 위험도 ${rep.summary.risk_score} / ${esc(rep.summary.severity)} — 샌드박스: ${esc(rep.sandbox?.runtime)} (네트워크: ${esc(rep.sandbox?.network_mode)})</div>
    <div class="sub">시작: ${fmtTime(rep.analysis.started_at)} · 종료: ${fmtTime(rep.analysis.finished_at)} · 소요: ${rep.analysis.duration_seconds}초</div>

    <div class="sec"><h3>실행 단계 <span class="n">(${(rep.stages||[]).length})</span></h3><div class="stagebar">${stages}</div></div>

    <div class="sec"><h3>탐지 결과 <span class="n">(${rep.findings.length})</span></h3>${findings}</div>

    <div class="sec"><h3>행위 체인</h3>${chains}</div>

    <div class="sec"><h3>시스템콜 요약</h3>${syscallChips(bh.syscall_totals)}</div>

    <div class="sec"><h3>프로세스 실행 <span class="n">(${(bh.processes||[]).length})</span></h3>${eventRows(bh.processes,'기록된 프로세스 실행이 없습니다.')}</div>

    <div class="sec"><h3>민감 파일 접근 <span class="n">(${(bh.files||[]).length})</span></h3>${eventRows(bh.files,'민감 경로 접근이 없습니다. (일반 파일 접근 전체가 아닌 .aws/.ssh/.netrc/passwd 등만 추적)')}</div>

    <div class="sec"><h3>네트워크 연결 <span class="n">(${(bh.connections||[]).length})</span></h3>${eventRows(bh.connections,'connect 시도가 없습니다.')}</div>

    <div class="sec"><h3>DNS 조회 <span class="n">(${(bh.dns||[]).length})</span></h3>${eventRows(bh.dns,'DNS 조회가 없습니다.')}</div>

    <div class="sec"><h3>조회된 도메인 <span class="n">(${(bh.dns_domains||[]).length})</span></h3>${(bh.dns_domains||[]).length?(bh.dns_domains||[]).map(d=>`<span class="chip neutral">${esc(d)}</span>`).join(''):'<div class="empty small">캡처된 도메인 이름이 없습니다 (network=full에서 실제 패킷을 디코딩해야 나옴 — connect 시도만으로는 도메인명을 알 수 없음).</div>'}</div>

    <div class="sec"><h3>권한/샌드박스 탈출 시도 <span class="n">(${(bh.privilege||[]).length})</span></h3>${eventRows(bh.privilege,'권한 변경이나 탈출 관련 syscall이 없습니다.')}</div>

    <div class="sec"><h3>패킷 캡처 flow <span class="n">(${(bh.flows||[]).length})</span></h3>${flowRows(bh.flows)}</div>

    <div class="sec"><h3>eBPF 호스트 경계 관찰 <span class="n">(${(bh.host_boundary||[]).length})</span></h3>${hostBoundaryRows(bh.host_boundary)}</div>

    <div class="sec"><h3>수집기 상태</h3>${Object.entries(cs).map(([k,v])=>collectorChip(k,v)).join('')}</div>

    <div class="sec"><h3>리소스 사용량</h3><div class="kv">
      <div>proc</div><div>${ru.proc?`${ru.proc.samples}회 샘플링, 최대 ${ru.proc.processes}개 프로세스, ${ru.proc.rss_kb} KB RSS (시계열 ${ru.proc.series?.length||0}개 포인트 보관)`:'—'}</div>
      <div>cgroup</div><div>${ru.cgroup?`${ru.cgroup.samples}회 샘플링, ${(ru.cgroup.memory_bytes/1048576).toFixed(1)} MB, ${ru.cgroup.pids}개 PID, CPU ${(ru.cgroup.cpu_usec/1e6).toFixed(2)}초 (시계열 ${ru.cgroup.series?.length||0}개 포인트 보관)`:'—'}</div>
    </div></div>

    <div class="sec"><h3>파일시스템 변경 — 생성 <span class="n">(${rep.filesystem_diff?.created?.length||0})</span></h3>${fsPathList(rep.filesystem_diff?.created)}</div>
    <div class="sec"><h3>파일시스템 변경 — 수정 <span class="n">(${rep.filesystem_diff?.modified?.length||0})</span></h3>${fsPathList(rep.filesystem_diff?.modified)}</div>
    <div class="sec"><h3>파일시스템 변경 — 삭제 <span class="n">(${rep.filesystem_diff?.deleted?.length||0})</span></h3>${fsPathList(rep.filesystem_diff?.deleted)}</div>

    <div class="sec"><h3>산출물 파일 <span class="n">logs/${esc(id)}/</span></h3><div id="logbundle"><div class="empty small">불러오는 중...</div></div></div>

    ${rep.errors?.length?`<div class="sec"><h3>오류</h3><pre>${esc(rep.errors.join('\n'))}</pre></div>`:''}
  </div></div>`;
  loadLogBundle(id);
}

async function loadLogBundle(id){
  const box=document.querySelector('#logbundle');
  if(!box) return;
  try{
    const lr=await fetch(api+'/api/analysis/'+id+'/logs');
    if(!lr.ok){box.innerHTML='<div class="empty small">이 분석에는 로그 산출물이 없습니다.</div>';return;}
    const files=await lr.json();
    if(!files.length){box.innerHTML='<div class="empty small">저장된 로그 파일이 없습니다.</div>';return;}
    const cards=await Promise.all(files.map(async f=>{
      if(f==='network.pcap'){
        return `<details class="stagecard"><summary><span>${esc(f)}</span><span class="badge2">바이너리</span></summary><div class="empty small">텍스트로 표시할 수 없습니다 — <a href="${api}/api/analysis/${id}/logs/${f}" target="_blank" rel="noopener">다운로드</a></div></details>`;
      }
      const cr=await fetch(api+'/api/analysis/'+id+'/logs/'+f);
      const text=cr.ok?await cr.text():'(불러오기 실패)';
      return `<details class="stagecard"><summary><span>${esc(f)}</span><span class="badge2">${text.length}자</span></summary><pre>${esc(text||'(내용 없음)')}</pre></details>`;
    }));
    box.innerHTML=cards.join('');
  }catch(e){
    box.innerHTML='<div class="empty small">로그를 불러오지 못했습니다.</div>';
  }
}

function closeDetail(e){if(e.target===e.currentTarget||e.target.classList.contains('close'))document.querySelector('#overlay').innerHTML='';}

loadReports();
</script></body></html>
